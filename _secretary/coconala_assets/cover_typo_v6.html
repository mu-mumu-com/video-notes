<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#15120D; --ink-deep:#0E0C07;
    --paper:#ECE3D1;
    --paper-dim:rgba(236,227,209,.60);
    --hair:rgba(236,227,209,.22);
    --mark:#A9843F;               /* 唯一の色。見出し下の一本の罫のみ */
  }
  html,body{width:3840px;height:1260px;overflow:hidden;background:var(--ink-deep)}
  .scale{transform:scale(3);transform-origin:top left}
  .stage{
    position:relative;width:1280px;height:420px;overflow:hidden;
    background:var(--ink);color:var(--paper);
    font-family:"Zen Old Mincho",serif;
  }
  /* 地：温かい墨色 + ごく淡い斜光 + 右下の沈み（ヴィネット） */
  .stage::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(900px 520px at 6% -22%, rgba(214,182,130,.055), transparent 60%),
      radial-gradient(1100px 720px at 104% 128%, rgba(0,0,0,.44), transparent 55%),
      linear-gradient(174deg,#17130C,#100D08 72%);
  }
  /* 紙の粒状感（極薄・ソフトライト） */
  .stage::after{
    content:"";position:absolute;inset:0;z-index:1;opacity:.045;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* 左の一本罫：製本の版面（はんめん）margin。規律の記号 */
  .margin-rule{position:absolute;left:44px;top:34px;bottom:34px;width:1px;background:var(--hair);z-index:2}

  /* 上段：左に屋号、右に仕事のやり方（版面の柱） */
  .masthead{position:absolute;left:74px;right:54px;top:30px;z-index:3;display:flex;justify-content:space-between;align-items:baseline}
  .wordmark{
    font-family:"Fraunces",serif;font-weight:500;
    font-size:19px;letter-spacing:.015em;color:var(--paper-dim);
  }
  .wordmark span{font-weight:400;margin-left:.14em;color:rgba(236,227,209,.42)}
  .stance{
    font-family:"Zen Old Mincho",serif;font-weight:400;
    font-size:13.5px;line-height:1.9;letter-spacing:.12em;
    color:rgba(236,227,209,.56);text-align:right;
  }

  .content{position:absolute;left:74px;top:50%;transform:translateY(-50%);z-index:3}
  .headline{
    font-family:"Zen Old Mincho",serif;font-weight:700;
    font-size:57px;line-height:1.42;letter-spacing:.055em;
    color:#F4ECDA;
  }
  .rule{width:44px;height:3px;background:var(--mark);margin:26px 0 16px}
  .sub{
    font-family:"Zen Old Mincho",serif;font-weight:400;
    font-size:15px;line-height:1.7;letter-spacing:.09em;
    color:var(--paper-dim);
  }
</style></head>
<body>
<div class="scale">
  <div class="stage">
    <div class="margin-rule"></div>
    <div class="masthead">
      <div class="wordmark">momemo<span>studio</span></div>
      <p class="stance">デザインから公開まで<br>ひとりで担当します</p>
    </div>
    <div class="content">
      <h1 class="headline">伝わるホームページを、<br>丁寧につくります。</h1>
      <div class="rule"></div>
      <p class="sub">ホームページ・LP制作 ／ GASによる業務自動化</p>
    </div>
  </div>
</div>
</body></html>
