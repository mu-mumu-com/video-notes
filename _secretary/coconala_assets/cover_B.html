<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:420px;overflow:hidden}
  .stage{
    position:relative;width:1280px;height:420px;
    background:#0b0d0f;color:#f5f6f7;
    font-family:"Zen Kaku Gothic New",sans-serif;
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/100% 66px,
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/66px 100%,
      radial-gradient(1000px 520px at 88% 0%, rgba(74,214,200,.10), transparent 62%),
      radial-gradient(1200px 800px at 12% 120%, rgba(60,90,120,.10), transparent 55%);
    -webkit-mask-image:radial-gradient(1400px 700px at 30% 50%,#000,rgba(0,0,0,.35));
            mask-image:radial-gradient(1400px 700px at 30% 50%,#000,rgba(0,0,0,.35));
  }
  .stage::after{
    content:"";position:absolute;inset:0;opacity:.045;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .content{position:absolute;left:74px;top:50%;transform:translateY(-50%);z-index:2}
  .chip{
    display:inline-flex;align-items:center;gap:9px;
    font-family:"Space Grotesk",sans-serif;font-size:12.5px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;
    color:rgba(245,246,247,.62);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:7px 15px 7px 12px;
  }
  .chip::before{content:"";width:8px;height:8px;border-radius:50%;
    background:#4ad6c8;box-shadow:0 0 10px rgba(74,214,200,.9)}
  .wordmark{
    font-family:"Space Grotesk",sans-serif;font-weight:700;
    font-size:64px;line-height:1;letter-spacing:-.03em;
    margin:22px 0 0;color:#f6f7f8;
  }
  .wordmark span{color:rgba(245,246,247,.42);font-weight:500}
  .rule{width:46px;height:3px;background:#4ad6c8;margin:24px 0 18px}
  .tagline{
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;
    font-size:18px;line-height:1.8;color:rgba(245,246,247,.72);letter-spacing:.02em;
  }
</style></head>
<body>
<div class="stage">
  <div class="content">
    <span class="chip">Available for work</span>
    <h1 class="wordmark">momemo <span>studio</span></h1>
    <div class="rule"></div>
    <p class="tagline">ホームページ・LP制作 ／ GASによる業務自動化ツール開発</p>
  </div>
</div>
</body></html>
