<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Shippori+Mincho:wght@500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:3840px;height:1260px;overflow:hidden;background:#0c0b0d}
  .scale{transform:scale(3);transform-origin:top left}
  .stage{
    position:relative;width:1280px;height:420px;
    background:#0c0b0d;color:#f4f2ee;
    font-family:"Shippori Mincho",serif;
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(1200px 560px at 16% -10%, rgba(196,150,96,.10), transparent 58%),
      radial-gradient(1000px 640px at 92% 118%, rgba(120,150,210,.09), transparent 55%),
      radial-gradient(1500px 1000px at 50% 50%, rgba(255,255,255,.022), transparent 72%),
      linear-gradient(180deg,#100e11,#0a090b);
  }
  .stage::after{
    content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:soft-light;z-index:5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* 右下に巨大な淡いワードマーク（エディトリアルな奥行き。グローではなく活字） */
  .ghost{
    position:absolute;right:38px;bottom:-28px;z-index:1;
    font-family:"Fraunces",serif;font-style:italic;font-weight:400;
    font-size:190px;line-height:1;letter-spacing:-.03em;
    color:rgba(244,242,238,.04);
    -webkit-user-select:none;user-select:none;
  }
  .frame{position:absolute;inset:16px;border:1px solid rgba(255,255,255,.06);pointer-events:none;z-index:4}
  .content{position:absolute;left:84px;top:38%;transform:translateY(-50%);z-index:3;max-width:820px}
  .eyebrow{
    font-family:"Space Grotesk",sans-serif;
    font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(244,242,238,.58);display:flex;align-items:center;gap:12px;
  }
  .eyebrow::before{content:"";width:24px;height:1px;background:rgba(216,185,138,.9)}
  .wordmark{
    font-family:"Fraunces",serif;font-weight:400;
    font-size:21px;letter-spacing:.01em;color:rgba(244,242,238,.72);
    margin:12px 0 20px;
  }
  .wordmark i{font-style:italic;color:#d8b98a;margin-left:.12em}
  .headline{
    font-family:"Shippori Mincho",serif;font-weight:600;
    font-size:44px;line-height:1.3;letter-spacing:.03em;
    color:#f6f4ef;text-shadow:0 1px 18px rgba(0,0,0,.35);
  }
  .rule{width:56px;height:1px;background:rgba(216,185,138,.85);margin:16px 0 12px}
  .sub{
    font-family:"Shippori Mincho",serif;font-weight:500;
    font-size:16.5px;line-height:1.8;letter-spacing:.05em;
    color:rgba(244,242,238,.66);
  }
</style></head>
<body>
<div class="scale">
  <div class="stage">
    <div class="ghost">momemo</div>
    <div class="frame"></div>
    <div class="content">
      <div class="eyebrow">Homepage &middot; LP &middot; GAS Automation</div>
      <div class="wordmark">momemo<i>studio</i></div>
      <h1 class="headline">伝わるホームページを、<br>丁寧につくります。</h1>
      <div class="rule"></div>
      <p class="sub">ホームページ・LP制作 ／ GASによる業務自動化ツール開発</p>
    </div>
  </div>
</div>
</body></html>
